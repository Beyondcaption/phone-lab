<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>phone-lab</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 14px system-ui, sans-serif; }
  #grid { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  .tile { background: #1c1c1c; border-radius: 8px; padding: 8px; width: 375px; }
  .tile.big { width: 750px; }
  .head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 5px; background: #c33; margin-right: 6px; }
  .dot.on { background: #3c3; }
  .screen { position: relative; background: #000; aspect-ratio: 375 / 667; cursor: crosshair; user-select: none; }
  .screen img { width: 100%; height: 100%; display: block; pointer-events: none; }
  .screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .ctl { display: flex; gap: 6px; margin-top: 6px; }
  .ctl input { flex: 1; background: #222; color: #ddd; border: 1px solid #444; padding: 6px; }
  button { background: #333; color: #ddd; border: 1px solid #555; padding: 6px 10px; cursor: pointer; }
  button:hover { background: #444; }
  .msg { font-size: 12px; color: #999; min-height: 16px; }
</style>
</head>
<body>
<div id="grid"></div>
<script>
const post = (id, action, data) => fetch(`/cmd/${id}/${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data || {}) })
  .then(r => r.json()).then(j => { if (!j.ok) note(id, 'Fehler: ' + j.error); });
const note = (id, t) => { const m = document.querySelector(`#t${id} .msg`); m.textContent = t; setTimeout(() => m.textContent === t && (m.textContent = ''), 3000); };

function tile(d) {
  const el = document.createElement('div');
  el.className = 'tile'; el.id = 't' + d.id;
  el.innerHTML = `
    <div class="head"><b>${d.name}</b><span><span class="dot"></span><span class="st">...</span></span></div>
    <div class="screen"><img src="/stream/${d.id}" alt=""><canvas></canvas></div>
    <div class="ctl"><input placeholder="Text eingeben, Enter sendet" title="Shift+Klick auf dem Bild = Doppeltipp"><button class="send">Senden</button></div>
    <div class="ctl"><button class="home">Home</button><button class="ig">Instagram</button><button class="zoom">Groß</button></div>
    <div class="msg"></div>`;
  const scr = el.querySelector('.screen'), img = el.querySelector('img'), inp = el.querySelector('input'), cv = el.querySelector('canvas');

  // Leuchtspur: Linie entlang der Mausspur, Ring beim Tippen, blendet nach dem Loslassen aus
  let trail = [], trailAlpha = 0;
  const draw = () => {
    cv.width = scr.clientWidth; cv.height = scr.clientHeight;
    const c = cv.getContext('2d'); c.clearRect(0, 0, cv.width, cv.height);
    if (!trail.length || trailAlpha <= 0) return;
    c.globalAlpha = trailAlpha; c.strokeStyle = '#4af'; c.fillStyle = '#4af'; c.lineWidth = 4; c.lineCap = 'round'; c.lineJoin = 'round';
    c.shadowColor = '#4af'; c.shadowBlur = 12;
    c.beginPath(); trail.forEach((p, i) => c[i ? 'lineTo' : 'moveTo'](p.x * cv.width, p.y * cv.height)); c.stroke();
    const l = trail[trail.length - 1]; c.beginPath(); c.arc(l.x * cv.width, l.y * cv.height, 7, 0, 7); c.fill();
  };
  const fade = () => { trailAlpha -= 0.05; draw(); if (trailAlpha > 0) requestAnimationFrame(fade); else trail = []; };
  const flash = p => { trail = [p]; trailAlpha = 1; draw(); setTimeout(fade, 150); };
  const norm = e => { const r = scr.getBoundingClientRect(); return { x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)) }; };

  // Linke Maustaste: Klick = tippen (sofort), zweiter Klick innerhalb 300 ms oder Shift+Klick = Doppeltipp, gedrückt ziehen = wischen entlang der Mausspur
  let down = null, pathPts = [], lastTap = 0;
  scr.addEventListener('contextmenu', e => e.preventDefault());
  scr.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    down = { ...norm(e), t: Date.now() }; pathPts = [{ ...down, t: 0 }]; scr.setPointerCapture(e.pointerId);
    trail = [down]; trailAlpha = 1; draw();
  });
  scr.addEventListener('pointermove', e => {
    if (!down) return;
    const p = { ...norm(e), t: Date.now() - down.t };
    if (p.t - pathPts[pathPts.length - 1].t >= 25) { pathPts.push(p); trail.push(p); draw(); }
  });
  const finish = e => {
    if (!down) return;
    const up = { ...norm(e), t: Date.now() - down.t }, start = down; down = null;
    pathPts.push(up); trail.push(up); draw(); setTimeout(fade, 200);
    const far = pathPts.some(p => Math.hypot((p.x - start.x) * scr.clientWidth, (p.y - start.y) * scr.clientHeight) > 12);
    if (far) { post(d.id, 'swipe', { path: pathPts }); return; }
    if (e.shiftKey || Date.now() - lastTap < 300) { lastTap = 0; post(d.id, 'doubletap', up); note(d.id, 'Doppeltipp'); return; }
    lastTap = Date.now(); post(d.id, 'tap', up);
  };
  scr.addEventListener('pointerup', e => e.button === 0 && finish(e));
  scr.addEventListener('pointercancel', () => { down = null; fade(); });

  const send = () => { if (inp.value) { post(d.id, 'text', { text: inp.value }); inp.value = ''; } };
  el.querySelector('.send').onclick = send;
  inp.addEventListener('keydown', e => e.key === 'Enter' && send());
  el.querySelector('.home').onclick = () => post(d.id, 'home');
  el.querySelector('.ig').onclick = () => post(d.id, 'instagram');
  el.querySelector('.zoom').onclick = () => el.classList.toggle('big');
  img.onerror = () => setTimeout(() => img.src = `/stream/${d.id}?${Date.now()}`, 5000);
  return el;
}

async function refresh() {
  const devs = await fetch('/devices').then(r => r.json());
  for (const d of devs) {
    let el = document.getElementById('t' + d.id) || document.getElementById('grid').appendChild(tile(d));
    el.querySelector('.dot').classList.toggle('on', d.ready);
    el.dataset.stream = el.querySelector('img').naturalWidth > 0 ? '1' : '0';
    el.querySelector('.st').textContent = (d.ready ? 'WDA läuft' : d.running ? 'WDA startet' : 'WDA aus')
      + (el.dataset.stream === '1' ? ', Stream' : ', kein Stream') + (d.battery != null ? `, Akku ${d.battery} %` : '');
  }
}
refresh(); setInterval(refresh, 5000);
</script>
</body>
</html>
